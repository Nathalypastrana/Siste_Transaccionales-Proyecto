spring.application.name=reservas

# Base de datos SQL Server (configurable con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ReservasHotelDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:cambiar_esta_clave}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# El esquema lo crea database/schema.sql; Hibernate no lo modifica
spring.jpa.hibernate.ddl-auto=none
# Respeta los nombres exactos de tablas y columnas (idHabitacion, fechaEntrada, ...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Tiempo máximo de espera de un bloqueo (ms) para el control de concurrencia
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

server.port=8080
