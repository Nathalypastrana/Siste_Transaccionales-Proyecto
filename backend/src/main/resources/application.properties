spring.application.name=reservas

# Base de datos SQL Server (configurable con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ReservasHotelDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:cambiar_esta_clave}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Si la base no responde, falla en 5 s (en vez de los 30 s por defecto) y la API devuelve 503
spring.datasource.hikari.connection-timeout=5000

# El esquema lo crea database/schema.sql; Hibernate no lo modifica
spring.jpa.hibernate.ddl-auto=none
# Respeta los nombres exactos de tablas y columnas (idHabitacion, fechaEntrada, ...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Tiempo máximo de espera de un bloqueo (ms) para el control de concurrencia
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

server.port=8080

# ---------------- Consultor virtual (IA) + WhatsApp ----------------
# Claves SIEMPRE por variables de entorno; nunca en el repositorio.
# Proveedor del modelo de lenguaje: claude (por defecto) o gemini
asistente.proveedor=${ASISTENTE_PROVEEDOR:claude}

# Claude (Anthropic) - de pago por uso
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.modelo=${ANTHROPIC_MODELO:claude-haiku-5-5}

# Gemini (Google AI Studio) - tiene nivel gratuito (en él Google puede usar los datos para mejorar sus productos)
gemini.api-key=${GEMINI_API_KEY:}
gemini.modelo=${GEMINI_MODELO:gemini-2.5-flash}

asistente.max-mensajes-por-hora=20
# Solo desarrollo: permite probar el consultor sin WhatsApp (POST /api/asistente/simular)
asistente.simulador-habilitado=${ASISTENTE_SIMULADOR:false}
# Número de recepción (con indicativo, solo dígitos) al que se avisan las consultas derivadas. Opcional.
asistente.numero-recepcion=${RECEPCION_WHATSAPP:}

whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
