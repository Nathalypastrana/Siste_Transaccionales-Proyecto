spring.application.name=reservas

# Base de datos SQL Server (configurable con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=hotel_reservas;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:cambiar_esta_clave}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# El esquema lo crea db/schema.sql; Hibernate solo valida que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Tiempo máximo de espera de un bloqueo (ms) para el control de concurrencia
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

server.port=8080
