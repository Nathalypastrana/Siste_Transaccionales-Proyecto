spring.application.name=reservas

# Base de datos SQL Server (configurable con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ReservasHotelDB;encrypt=true;trustServerCertificate=true}
# Sin valor por defecto a propósito: la app no arranca si no se definen DB_USER y DB_PASSWORD (variables de entorno).
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Si la base no responde, falla en 5 s (en vez de los 30 s por defecto) y la API devuelve 503
spring.datasource.hikari.connection-timeout=5000

# El esquema lo crea database/schema.sql; Hibernate no lo modifica
spring.jpa.hibernate.ddl-auto=none
# Respeta los nombres exactos de tablas y columnas (idHabitacion, fechaEntrada, ...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Tiempo máximo de espera de un bloqueo (ms) para el control de concurrencia
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

server.port=8080

# ---------------- Consultor virtual (IA) + WhatsApp ----------------
# Claves SIEMPRE por variables de entorno; nunca en el repositorio.
# Proveedor del modelo de lenguaje: claude (por defecto) o gemini
asistente.proveedor=${ASISTENTE_PROVEEDOR:claude}

# Claude (Anthropic) - de pago por uso
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.modelo=${ANTHROPIC_MODELO:claude-haiku-5-5}

# Gemini (Google AI Studio) - tiene nivel gratuito (en él Google puede usar los datos para mejorar sus productos)
gemini.api-key=${GEMINI_API_KEY:}
gemini.modelo=${GEMINI_MODELO:gemini-3.5-flash-lite}

asistente.max-mensajes-por-hora=20
# Solo desarrollo: permite probar el consultor sin WhatsApp (POST /api/asistente/simular)
asistente.simulador-habilitado=${ASISTENTE_SIMULADOR:false}
# Número de recepción (con indicativo, solo dígitos) al que se avisan las consultas derivadas. Opcional.
asistente.numero-recepcion=${RECEPCION_WHATSAPP:}

# Proveedor de WhatsApp: meta (Cloud API, por defecto) o twilio (API de Twilio, p. ej. su Sandbox sin verificación de negocio)
whatsapp.proveedor=${WHATSAPP_PROVEEDOR:meta}
# Versión de la Graph API de Meta
whatsapp.graph-url=${WHATSAPP_GRAPH_URL:https://graph.facebook.com/v25.0}

# Twilio (solo si WHATSAPP_PROVEEDOR=twilio). Webhook entrante: <TWILIO_URL_PUBLICA>/api/whatsapp/twilio
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
# Número de WhatsApp de Twilio (el del Sandbox es +14155238886)
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:+14155238886}
# URL pública del backend tal como la llama Twilio (ngrok); se usa para validar la firma y recibir estados de entrega
twilio.url-publica=${TWILIO_URL_PUBLICA:}

whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}

# ---------------- Seguridad (JWT) ----------------
# Secreto para firmar los tokens (mínimo 32 caracteres). Definir siempre en producción.
seguridad.jwt-secreto=${JWT_SECRET:}
seguridad.jwt-minutos=${JWT_MINUTOS:120}
# Primer administrador (solo se crea si no existe ninguno activo)
seguridad.admin-correo=${ADMIN_CORREO:}
seguridad.admin-password=${ADMIN_PASSWORD:}
# Acepta una vez las claves guardadas en texto plano y las convierte a BCrypt
# Por seguridad NO se aceptan contraseñas en texto plano. Ponlo en true solo temporalmente para migrar cuentas antiguas.
seguridad.migrar-claves-planas=${MIGRAR_CLAVES_PLANAS:false}

# Recuperación de contraseña (correo). Para enviar correos reales define SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD (si SPRING_MAIL_HOST no existe, el enlace solo se escribe en el log).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
correo.remitente=${SMTP_FROM:}
app.url-frontend=${APP_URL:http://localhost:5173}

# Notificaciones de reservas (crear / modificar / cancelar) al huésped: correo, whatsapp o ambos
notificaciones.canales=${NOTIFICACIONES_CANALES:correo,whatsapp}
notificaciones.indicativo-pais=${INDICATIVO_PAIS:57}
notificaciones.nombre-hotel=${NOMBRE_HOTEL:Hotel En mi pueblito}
# Plantilla de WhatsApp aprobada por Meta (2 variables: {{1}} nombre, {{2}} resumen). Si se deja vacía se envía texto libre,
# que Meta solo entrega si el cliente escribió en las últimas 24 horas.
whatsapp.plantilla-reserva=${WHATSAPP_PLANTILLA_RESERVA:}
whatsapp.idioma-plantilla=${WHATSAPP_IDIOMA_PLANTILLA:es}
notificaciones.dias-alerta-tarifa=${NOTIFICACIONES_DIAS_ALERTA_TARIFA:15}
